name: Finalize v0.17.9

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  verify-and-finalize:
    if: github.event.head_commit.message == 'Prepare clean v0.17.9 release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Align package-lock version exactly
        run: |
          python - <<'PY'
          import json, pathlib, hashlib
          p=pathlib.Path('package-lock.json')
          d=json.loads(p.read_text())
          d['version']='0.17.9'
          d['packages']['']['version']='0.17.9'
          s=json.dumps(d, ensure_ascii=False, indent=2)+'\n'
          p.write_text(s)
          got=hashlib.sha256(s.encode()).hexdigest()
          expected='3fb981ebce58b1bb36a83d9416bb7a0d4ca98ffb7cfd2d32c86d5636ad577b66'
          if got != expected:
              raise SystemExit(f'package-lock sha mismatch: {got}')
          print('package-lock exact SHA-256:', got)
          PY
      - run: npm ci
      - run: npm run syntax-check
      - run: npm run test:v0178:all
      - run: npm run build
      - name: Commit exact verified release and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/finalize-v0179.yml
          git add package-lock.json .github/workflows/finalize-v0179.yml
          git commit -m "Publish v0.17.9 required five-year learning route"
          git push origin HEAD:main
