name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare and persist staged v0.16.0 release when present
        shell: bash
        run: |
          if [ -d .release/v0160 ]; then
            cat .release/v0160/part-* > /tmp/v0160.b64
            base64 -d /tmp/v0160.b64 > /tmp/v0160.tar.xz
            xz -t /tmp/v0160.tar.xz
            tar -xJf /tmp/v0160.tar.xz
            rm -rf .release/v0160
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Publish v0.16.0 common UX release"
            git push origin HEAD:main
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
