name: Apply v0.17.11 release

on:
  push:
    branches: ["release-v0.17.11-staging"]
    paths:
      - ".github/v01711-patch/**"
      - ".github/workflows/apply-v01711.yml"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify transfer and apply reviewed patch
        shell: bash
        run: |
          cat .github/v01711-patch/chunk-* | base64 --decode > /tmp/v01711.patch.gz
          echo "387ce84186c29ec8a6933bbaf7a22472c3e8d2e5d7f1d346accc51051d93606b  /tmp/v01711.patch.gz" | sha256sum -c -
          gzip -dc /tmp/v01711.patch.gz > /tmp/v01711.patch
          git apply --check /tmp/v01711.patch
          git apply /tmp/v01711.patch
          rm -rf .github/v01711-patch
          rm -f .github/workflows/apply-v01711.yml
      - run: npm ci
      - run: npm run self-check
      - run: npm run verify-critical
      - run: npm run syntax-check
      - run: npm run test:v0178:all
      - run: npm run test:v01710-browser-bugs
      - run: npm run test:remediation-figures-hidden
      - run: npm run build
      - name: Commit verified v0.17.11 release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish v0.17.11 remediation figures hidden"
          git push origin HEAD:release-v0.17.11-staging
