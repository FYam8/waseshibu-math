name: Fix topbar after sync CSS removal

on:
  push:
    branches: ["work/remove-github-sync-v0.17.12"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/remove-github-sync-v0.17.12
      - name: Restore shared topbar layout and strengthen audit
        run: |
          python - <<'PY'
          from pathlib import Path

          styles_path=Path('src/styles.css')
          styles=styles_path.read_text()
          required='.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px}'
          if required in styles:
              raise SystemExit('topbar flex rule already present unexpectedly')
          marker='@media(max-width:700px){\n  .topbar{flex-direction:row;align-items:center;padding:8px 12px}'
          if marker not in styles:
              raise SystemExit('mobile topbar marker not found')
          styles=styles.replace(marker,required+'\n'+marker,1)
          styles_path.write_text(styles)

          audit_path=Path('scripts/verify-github-sync-separation-v01712.mjs')
          audit=audit_path.read_text()
          marker2="const styles=read('src/styles.css')\n"
          if marker2 not in audit:
              raise SystemExit('styles audit marker not found')
          extra="assert.equal(styles.includes('.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px}'),true,'shared topbar flex layout must survive sync CSS removal')\nassert.equal(styles.includes('.local-badge'),true,'local data protection badge styling must remain')\n"
          if extra.strip() in audit:
              raise SystemExit('topbar audit already present unexpectedly')
          audit=audit.replace(marker2,marker2+extra,1)
          audit_path.write_text(audit)

          Path('.github/workflows/fix-topbar-after-sync-css-removal.yml').unlink()
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Restore topbar layout after sync CSS cleanup"
          git push origin HEAD:work/remove-github-sync-v0.17.12
