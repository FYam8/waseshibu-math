name: Prepare v0.15.1 release

on:
  push:
    branches: ["release-v0.15.1"]
    paths:
      - ".github/workflows/release-v0151.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-v0.15.1
          fetch-depth: 0
      - name: Reconstruct audited release
        shell: bash
        run: |
          set -euo pipefail
          cat .release/v0151/part-* > /tmp/v0151.b64
          base64 --decode /tmp/v0151.b64 > /tmp/v0151.tar.xz
          tar -xJf /tmp/v0151.tar.xz -C .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run self-check
      - run: npm run verify-critical
      - run: npm run test:migration
      - run: npm run build
      - name: Commit verified release source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release/v0151
          rm -f .github/workflows/release-v0151.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish v0.15.1 audited math release"
          git push origin HEAD:release-v0.15.1
