name: Fix v0.17.12 lock metadata

on:
  push:
    branches:
      - work/remove-github-sync-v0.17.12

permissions:
  contents: write

jobs:
  fix-lock:
    if: ${{ !contains(github.event.head_commit.message, '[lock-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/remove-github-sync-v0.17.12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit lock metadata only
        run: |
          git diff --exit-code -- package.json
          git diff --quiet -- package-lock.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Align package lock metadata with v0.17.12 [lock-fixed]"
          git push origin HEAD:work/remove-github-sync-v0.17.12
