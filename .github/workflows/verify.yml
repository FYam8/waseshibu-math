name: Verify math app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run self-check
      - run: npm run verify-critical
      - run: node scripts/test-progress-cloud-sync.mjs
      - run: npm run build
      - run: npm run test:v01710-browser-bugs
      - name: Install browser regression dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify mobile and desktop math input
        run: python scripts/test-math-input-browser.py
