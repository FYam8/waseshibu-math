name: Verify math app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare staged v0.16.0 release when present
        shell: bash
        run: |
          if [ -d .release/v0160 ]; then
            cat .release/v0160/part-* > /tmp/v0160.b64
            base64 -d /tmp/v0160.b64 > /tmp/v0160.tar.xz
            xz -t /tmp/v0160.tar.xz
            tar -xJf /tmp/v0160.tar.xz
            touch /tmp/v0160-staged
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run self-check
      - run: npm run verify-critical
      - name: Run v0.16.0 migration and UX checks
        shell: bash
        run: |
          if [ -f /tmp/v0160-staged ]; then
            npm run test:migration
            npm run test:mastery
            npm run test:today
            npm run syntax-check
          fi
      - run: npm run build
